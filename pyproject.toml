[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "BINocular"
version = "1.1"
description = "Common Binary Framework"
authors = [{ name = "Brandon Wong" }]
requires-python = ">=3.10"
dependencies = [
    "rich",
    "click<8.2.0",
    "typer==0.15.2",
    "pydantic",
    "networkx",
    "coloredlogs",
    "archinfo",
    "pyvex",
    "GitPython",
    "meson",
    "rzpipe",
    "tree-sitter==0.23.1",
    "tree-sitter-c==0.23.1",
    "requests",
    "IPython",
    "pyghidra",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "mypy",
    "pytest",
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx_mdinclude",
    "build",
    "hatchling",
    "types-networkx",
    "types-requests",
    "ghidra-stubs==12.0.0",
]

[project.scripts]
binocular = "binocular.run:main"

[tool.hatch.build.targets.wheel]
packages = ["binocular"]

[tool.hatch.build.targets.wheel.shared-data]
"binocular/scripts" = "binocular/scripts"
